name: Test exact final v21 layout
on:
  push:
    branches: [feature/final-v21-scroll]
    paths:
      - interaction-upgrades.css
      - connection-manager.js
      - mobile-recovery-v21.js
      - sw.js
      - reset-kassa.html
      - tests/e2e-v21-scroll-final.mjs
      - .github/workflows/test-v21-scroll-final.yml
permissions:
  contents: write
concurrency:
  group: exact-final-v21-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/final-v21-scroll
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kassa-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/kassa-http.log
          exit 1
      - name: Run final test
        run: node tests/e2e-v21-scroll-final.mjs
      - name: Store result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-test-results || true
          git commit -m "Record exact final v21 test" || exit 0
          git push origin HEAD:feature/final-v21-scroll
