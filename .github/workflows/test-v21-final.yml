name: Test final v21 stable layout

on:
  push:
    branches:
      - feature/final-v21-stable
    paths:
      - interaction-upgrades.css
      - connection-manager.js
      - mobile-recovery-v21.js
      - sw.js
      - reset-kassa.html
      - tests/e2e-v21-final.mjs
      - .github/workflows/test-v21-final.yml

permissions:
  contents: write

concurrency:
  group: final-v21-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout final feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/final-v21-stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Start local web server
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/kassa-http.log 2>&1 &
          echo $! > /tmp/kassa-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/kassa-http.log
          exit 1

      - name: Run final old-layout, typography and no-jump tests
        run: node tests/e2e-v21-final.mjs

      - name: Commit test evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-test-results || true
          git commit -m "Record final v21 browser test" || exit 0
          git push origin HEAD:feature/final-v21-stable
