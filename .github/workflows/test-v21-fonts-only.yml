name: Test v21 restored layout and fonts only

on:
  push:
    branches:
      - feature/phone-fonts-only-v21
    paths:
      - interaction-upgrades.css
      - order-controls.js
      - sw.js
      - reset-kassa.html
      - tests/e2e-v21-fonts-only.mjs
      - .github/workflows/test-v21-fonts-only.yml

permissions:
  contents: write

concurrency:
  group: v21-fonts-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: feature/phone-fonts-only-v21

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Start local website
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/kassa-v21-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/kassa-v21-http.log
          exit 1

      - name: Test restored structure, modest fonts and no jump
        run: node tests/e2e-v21-fonts-only.mjs

      - name: Commit test evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-test-results || true
          git commit -m "Record v21 fonts-only regression test" || exit 0
          git push origin HEAD:feature/phone-fonts-only-v21
