name: Test v18 order controls and offline recovery

on:
  push:
    branches:
      - analysis/materialized-source-2026-07-25
    paths:
      - .github/workflows/test-v18-order-offline.yml

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4
        with:
          ref: analysis/materialized-source-2026-07-25

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Start local web server
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/kassa-http.log 2>&1 &
          echo $! > /tmp/kassa-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/kassa-http.log
          exit 1

      - name: Run mobile, offline and recovery test
        run: node tests/e2e-v18.mjs

      - name: Commit test evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-test-results || true
          git commit -m "Record v18 real-browser test results" || exit 0
          git push origin HEAD:analysis/materialized-source-2026-07-25

# Retry 2: wait for the cashier runtime before interacting with the boss PIN.
