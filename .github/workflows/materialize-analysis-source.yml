name: Materialize compressed source for analysis

on:
  push:
    branches:
      - analysis/materialized-source-2026-07-25
    paths:
      - .github/workflows/materialize-analysis-source.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/materialized-source-2026-07-25
      - name: Decode compressed application and server source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip

          out = Path('analysis-materialized')
          out.mkdir(exist_ok=True)

          def decode(parts, destination):
              encoded = ''.join(Path(p).read_text('utf-8').strip() for p in parts)
              data = gzip.decompress(base64.b64decode(encoded))
              Path(destination).write_bytes(data)

          app_parts = sorted(str(p) for p in Path('assets').glob('app.full.*.b64'))
          if app_parts:
              decode(app_parts, out / 'app.generated.js')
          decode(['assets/styles.css.gz.b64'], out / 'styles.generated.css')

          server_parts = sorted(str(p) for p in Path('server').glob('kassa-core.*.b64'))
          if server_parts:
              decode(server_parts, out / 'kassa_server.generated.py')
          PY
      - name: Commit generated analysis files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-materialized
          git commit -m "Materialize compressed source for connection audit" || exit 0
          git push origin HEAD:analysis/materialized-source-2026-07-25
