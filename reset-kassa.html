<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a1020">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Registratiekassa vernieuwen</title>
  <style>html,body{margin:0;min-height:100%;background:#07101b;color:#fff;font-family:system-ui,-apple-system,sans-serif}main{min-height:100dvh;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 28px) 28px calc(env(safe-area-inset-bottom,0px) + 28px);text-align:center}div{max-width:540px}h1{font-size:28px}p{color:#b8c4d9;line-height:1.5}</style>
</head>
<body>
<main><div><h1>Registratiekassa wordt vernieuwd…</h1><p>De oude PWA-cache wordt verwijderd. Bestellingen en loggegevens worden niet bewust gewist. Je wordt automatisch naar de echte mobiele bestelweergave v20 gestuurd.</p></div></main>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const registrations=await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(registration=>registration.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(key=>key.startsWith('registratiekassa-')).map(key=>caches.delete(key)));
    }
  }catch(error){console.warn(error);}
  location.replace('./?fresh=mobile-order-v20');
})();
</script>
</body>
</html>
